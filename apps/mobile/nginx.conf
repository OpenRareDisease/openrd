server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Security headers for the static app.
  #
  # There were none here and none in the Caddyfile either, and the API's
  # helmet() never runs for these routes because Caddy sends /* straight to
  # this container. That left the signed-in patient UI framable by any third
  # party: a plain clickjacking surface over runDeleteReport in
  # p-report_management and the seven consent toggles in p-privacy_settings.
  # The Caddyfile now sets the same set for the whole site (including /api);
  # these are the defence-in-depth copy for the paths that reach nginx
  # directly — the 127.0.0.1:8080 debug mapping, or any deployment that puts
  # this container behind a different proxy.
  #
  # `always` so they are attached to error responses too, not just 2xx/3xx.
  # Declared at server level: nginx only inherits add_header into a location
  # that declares none of its own, and neither location below does — if you
  # add an add_header to one, you must repeat this whole block inside it.
  #
  # The CSP is deliberately frame-ancestors only. The Expo web export relies
  # on inline bootstrap script, so a script-src policy would need to be
  # derived from the actual bundle rather than guessed at here.
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), payment=(), usb=()" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # /s/* is the public passport surface, mounted outside /api by the API
  # (see Caddyfile for the full reason). It has to be proxied here too,
  # not just in Caddy: this container is reachable directly on
  # 127.0.0.1:8080 in the compose file, and any deployment that puts a
  # different proxy in front of it would otherwise let `location /`
  # answer a share token with index.html at 200.
  location /s/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://api:4000/s/;
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;
    proxy_pass http://api:4000/api/;
  }
}
